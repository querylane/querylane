name: docs-eval

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/docs-eval.yml
      - blume.config.ts
      - bun.lock
      - components/**
      - components.ts
      - docs/**
      - evals.yaml
      - examples/**
      - package.json
      - patches/**
      - public/**
      - scripts/docs-eval.test.ts
      - theme.css

concurrency:
  group: docs-eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eval:
    if: |
      github.event.pull_request.draft != true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install docs dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install Codex
        run: npm install --global @openai/codex@0.145.0

      - name: Evaluate docs with Codex
        env:
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$CODEX_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY secret is not configured."
            exit 1
          fi
          bun run docs:eval
