# === Docker image pipeline ================================================
#   _docker-build.yml   reusable engine: multi-arch build (+ optional push)
#   docker-ci.yml       on PR         -> build both arches, no push (validate)
#   docker-publish.yml  on push main  -> querylane-dev : edge + sha-<sha>
#   release.yml         on release    -> querylane     : <version> + latest
# ==========================================================================
name: docker-ci

# On PRs: build the production image (both arches, no push) to catch build
# breakage before merge. Uses the same reusable workflow as publishing, so the
# build definitions never drift between validation and release.
#
# Runs on EVERY PR (no `paths:` filter) on purpose: the image bundles both
# frontend/ (bun build, embedded) and backend/ (go build), so almost any source
# change can break it. A path filter here silently rotted once (frontend/** was
# missing); always-run is correct-by-construction and stays cheap via the GHA
# build cache. Don't re-add a paths filter.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    if: github.event.pull_request.draft != true
    uses: ./.github/workflows/_docker-build.yml
    with:
      # Not pushed, so the name is cosmetic; mirror the dev channel for clarity.
      image: ghcr.io/${{ github.repository }}-dev
      push: false

  validate-docs:
    if: github.event.pull_request.draft != true
    uses: ./.github/workflows/_docker-build.yml
    with:
      image: ghcr.io/${{ github.repository }}-dev
      push: false
      dockerfile: ./Dockerfile.docs
      rolling_tag: docs-edge
      sha_prefix: docs-sha-
      cache_scope: querylane-docs-publish
      stamp_version: false

  validate-version:
    name: Validate stamped Docker version
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build version smoke image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: querylane-version-smoke
          build-args: |
            VERSION=9.9.9-test
            GIT_COMMIT=abcdef1
            BUILT_AT=2026-07-26T12:34:56Z
          cache-from: type=gha,scope=querylane-publish

      - name: Verify stamped version
        run: |
          set -euo pipefail
          actual_version="$(docker run --rm querylane-version-smoke --version)"
          if [ "$actual_version" != "9.9.9-test" ]; then
            echo "::error::Expected querylane --version to print 9.9.9-test, got $actual_version"
            exit 1
          fi
