name: frontend-ci

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTION_CHECKOUT: &action_checkout actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
  ACTION_SETUP_BUN: &action_setup_bun oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
  ACTION_CACHE: &action_cache actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
  ACTION_SETUP_NODE: &action_setup_node actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
  ACTION_UPLOAD_ARTIFACT: &action_upload_artifact actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
  BUN_VERSION: &bun_version 1.4.4
  NODE_VERSION: &node_version 24
  # Keep in sync with the `playwright` version in frontend/package.json. The
  # visual job fails fast when they drift, because baselines depend on it.
  PLAYWRIGHT_IMAGE: &playwright_image mcr.microsoft.com/playwright:v1.64.0-noble

permissions:
  contents: read

jobs:
  changes:
    name: Frontend Change Detection
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      frontend: ${{ steps.paths.outputs.frontend }}
    steps:
      - uses: *action_checkout
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect UI and quality-policy changes
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          paths="$RUNNER_TEMP/frontend-paths"
          git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" > "$paths"
          frontend=false
          while IFS= read -r -d '' path; do
            case "$path" in
              frontend/*|.github/workflows/frontend-ci.yml)
                frontend=true
                ;;
              */*) ;;
              *) frontend=true ;;
            esac
          done < "$paths"
          printf 'frontend=%s\n' "$frontend" >> "$GITHUB_OUTPUT"

  static:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    name: Frontend Static
    runs-on: ubuntu-latest
    timeout-minutes: 4
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: *action_checkout
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: *action_setup_node
        with:
          node-version: *node_version
      - uses: *action_setup_bun
        with:
          bun-version: *bun_version
      - name: Restore Bun package cache
        uses: *action_cache
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Run full frontend lint and policy checks
        env:
          QUALITY_BASE_REF: origin/${{ github.base_ref }}
        run: bun run lint
      - name: Run React Doctor dead-code analysis
        run: bun run doctor:dead-code
      - name: Type check
        run: bun run type:check
      - name: Verify shadcn registry sync
        run: bun run scripts/check-shadcn-registry-sync.ts

  unit:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    name: Frontend Unit
    runs-on: ubuntu-latest
    timeout-minutes: 4
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: *action_checkout
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: *action_setup_node
        with:
          node-version: *node_version
      - uses: *action_setup_bun
        with:
          bun-version: *bun_version
      - name: Restore Bun package cache
        uses: *action_cache
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Run unit tests
        run: bun run test:unit:ci

  integration:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    name: Frontend Integration
    runs-on: ubuntu-latest
    timeout-minutes: 4
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: *action_checkout
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: *action_setup_node
        with:
          node-version: *node_version
      - uses: *action_setup_bun
        with:
          bun-version: *bun_version
      - name: Restore Bun package cache
        uses: *action_cache
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Run integration tests
        run: bun run test:integration:ci

  browser:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    name: Frontend Browser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: *action_checkout
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: *action_setup_node
        with:
          node-version: *node_version
      - uses: *action_setup_bun
        with:
          bun-version: *bun_version
      - name: Restore Bun package cache
        uses: *action_cache
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Restore Playwright Chromium cache
        id: playwright-cache
        uses: *action_cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('frontend/node_modules/playwright-core/browsers.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium
      - name: Run browser tests
        run: bun run test:browser:ci
      - name: Run end-to-end tests
        run: bun run test:e2e:ci
      - name: Upload browser and E2E failure reports
        if: failure()
        uses: *action_upload_artifact
        with:
          name: browser-e2e-failure-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 3
          if-no-files-found: ignore

  visual:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    name: Frontend Visual (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Each Playwright test loads a full route; one 4-vCPU runner is CPU-bound,
    # so split the suite across runners instead of adding workers.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # Same image as `bun run test:visual:update`, so baselines match pixel for pixel.
    container:
      image: *playwright_image
      options: --ipc=host
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: *action_checkout
        with:
          persist-credentials: false
      # Installed through npm, as in scripts/playwright-container.sh: the
      # Playwright image ships Node but not the unzip that setup-bun relies on.
      - name: Install Bun
        run: npm install --global bun@${{ env.BUN_VERSION }}
      - name: Restore Bun package cache
        uses: *action_cache
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Check Playwright image matches the installed version
        shell: bash
        run: |
          set -euo pipefail
          installed="$(bun -e 'console.log(require("playwright/package.json").version)')"
          case "$PLAYWRIGHT_IMAGE" in
            *":v${installed}-"*) ;;
            *) echo "::error::PLAYWRIGHT_IMAGE ($PLAYWRIGHT_IMAGE) does not match playwright ${installed}"; exit 1 ;;
          esac
      - name: Run visual regression tests
        run: bun run test:visual --shard=${{ matrix.shard }}/3
      - name: Upload Playwright visual report
        if: failure()
        uses: *action_upload_artifact
        with:
          name: playwright-visual-report-${{ matrix.shard }}
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 3
          overwrite: true
          if-no-files-found: ignore

  build:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    env:
      SENTRY_AUTH_TOKEN: ${{ vars.SENTRY_AUTH_TOKEN != '' && vars.SENTRY_AUTH_TOKEN || secrets.SENTRY_AUTH_TOKEN || '' }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG != '' && vars.SENTRY_ORG || secrets.SENTRY_ORG || '' }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT != '' && vars.SENTRY_PROJECT || secrets.SENTRY_PROJECT || '' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: *action_checkout
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: *action_setup_node
        with:
          node-version: *node_version
      - uses: *action_setup_bun
        with:
          bun-version: *bun_version
      - name: Restore Bun package cache
        uses: *action_cache
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Restore Rsbuild/Rspack persistent cache
        uses: *action_cache
        with:
          path: frontend/node_modules/.cache/rsbuild
          key: ${{ runner.os }}-rsbuild-${{ hashFiles('frontend/bun.lock', 'frontend/package.json', 'frontend/rsbuild.config.ts', 'frontend/tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-rsbuild-
      - name: Build frontend
        env:
          PUBLIC_SENTRY_ENVIRONMENT: production
          PUBLIC_SENTRY_RELEASE: ${{ github.sha }}
        run: bun run build
      - name: Verify emitted bundle contracts
        run: bun run build:profile
      - name: Run full React Doctor analysis
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QUALITY_BASE_REF: origin/${{ github.base_ref }}
        run: bun run scripts/run-react-doctor-ci.ts

  gate:
    name: Frontend Quality Gate
    if: always()
    needs: [changes, static, unit, integration, browser, visual, build]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: *action_checkout
        with:
          persist-credentials: false
      - uses: *action_setup_bun
        with:
          bun-version: *bun_version
      - name: Require complete frontend results
        env:
          FRONTEND_CI_NEEDS: ${{ toJSON(needs) }}
        run: bun frontend/scripts/check-ci-gate.ts "$FRONTEND_CI_NEEDS"
