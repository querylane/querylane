name: frontend-browser-smoke

# Advisory engine evidence, not a required PR check or support certification.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 2"

permissions:
  contents: read

concurrency:
  group: frontend-browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Browser smoke (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, webkit]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Install the selected engine and system dependencies
        env:
          ENGINE: ${{ matrix.engine }}
        run: bunx --no-install playwright install --with-deps "$ENGINE"
      - name: Record source and browser identity
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          mkdir -p test-results
          {
            git rev-parse HEAD
            bunx --no-install playwright --version
            printf 'engine=%s\n' "$ENGINE"
            sha256sum bun.lock rsbuild.config.ts e2e/playwright.config.ts e2e/tests/browser-smoke.spec.ts
          } > test-results/smoke-revision.txt
      - name: Build production assets with existing hard byte checks
        run: bun run build
      - name: Run hermetic engine journeys without screenshot assertions
        env:
          ENGINE: ${{ matrix.engine }}
          QUERYLANE_E2E_SKIP_BUILD: "1"
        run: env -u NO_COLOR NODE_OPTIONS=--disable-warning=DEP0205 bunx --no-install playwright test --config=e2e/playwright.config.ts --project="smoke-$ENGINE" --workers=1
      - name: Keep detailed synthetic engine artifacts private
        if: always() && github.event.repository.private
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-smoke-${{ matrix.engine }}-${{ github.sha }}
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 3
          if-no-files-found: error
