name: Release

on:
  push:
    branches: [main]

env:
  ACTION_CHECKOUT: &action_checkout actions/checkout@v7.0.0
  ACTION_SETUP_BUN: &action_setup_bun oven-sh/setup-bun@v2.2.0
  ACTION_SETUP_NODE: &action_setup_node actions/setup-node@v6.4.0
  ACTION_CHANGESETS: &action_changesets changesets/action@v2.0.0-next.3
  BUN_VERSION: &bun_version 1.3.14
  NODE_VERSION: &node_version 24

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: "!contains(github.event.head_commit.message, 'ci skip') && !contains(github.event.head_commit.message, 'skip ci')"
    outputs:
      publish_latest: ${{ steps.release-tags.outputs.publish_latest || 'false' }}
      published: ${{ steps.release-tags.outputs.published || 'false' }}
      tag: ${{ steps.release-tags.outputs.tag }}
      version: ${{ steps.release-tags.outputs.version }}
    steps:
      - name: Checkout repository
        uses: *action_checkout
        with:
          # Changesets needs persisted credentials to create/update release PRs and tags.
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Bun
        uses: *action_setup_bun
        with:
          bun-version: *bun_version

      - name: Setup Node.js
        uses: *action_setup_node
        with:
          node-version: *node_version

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Expose frontend changesets at repository root
        id: changeset-dir
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .changeset ]; then
            echo "skip_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -d frontend/.changeset ]; then
            ln -s frontend/.changeset .changeset
            echo "skip_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "No frontend/.changeset directory found. Skipping release workflow."
          echo "skip_release=true" >> "$GITHUB_OUTPUT"

      - name: Create Release PR
        if: steps.changeset-dir.outputs.skip_release != 'true'
        id: changesets
        uses: *action_changesets
        with:
          version-script: bun run --cwd frontend changeset:version
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Resolve release metadata
        id: release-metadata
        if: >-
          steps.changeset-dir.outputs.skip_release != 'true' &&
          steps.changesets.outputs['has-changesets'] == 'false'
        run: |
          set -euo pipefail

          version="$(node -p "require('./frontend/package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a release version in X.Y.Z format, got '$version'"
            exit 1
          fi

          {
            echo "tag=v$version"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Tag released frontend package
        id: release-tags
        if: >-
          steps.changeset-dir.outputs.skip_release != 'true' &&
          steps.changesets.outputs['has-changesets'] == 'false'
        env:
          EXPECTED_TAG: ${{ steps.release-metadata.outputs.tag }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          VERSION: ${{ steps.release-metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          before_tags="$(mktemp)"
          after_tags="$(mktemp)"
          state_file="$(mktemp)"
          trap 'rm -f "$before_tags" "$after_tags" "$state_file"' EXIT

          git tag --list | sort > "$before_tags"
          bun run --cwd frontend changeset:tag
          git tag --list | sort > "$after_tags"

          mapfile -t tags < <(comm -13 "$before_tags" "$after_tags")

          GITHUB_OUTPUT="$state_file" bash scripts/resolve-release-state.sh \
            "$EXPECTED_TAG" \
            "$VERSION" \
            "$RUN_ATTEMPT" \
            "${tags[@]}"

          published="$(sed -n 's/^published=//p' "$state_file")"
          if [ "$published" = "true" ]; then
            # Fail before the irreversible push unless exact Changesets notes exist.
            bun scripts/extract-release-notes.ts "$VERSION" frontend/CHANGELOG.md > /dev/null
          fi

          push_tag="$(sed -n 's/^push_tag=//p' "$state_file")"
          tag="$(sed -n 's/^tag=//p' "$state_file")"
          if [ "$push_tag" = "true" ]; then
            git push origin "refs/tags/$tag"
          fi

          cat "$state_file" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        if: steps.release-tags.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release-tags.outputs.tag }}
          VERSION: ${{ steps.release-tags.outputs.version }}
        run: |
          set -euo pipefail

          notes_file="$(mktemp)"
          trap 'rm -f "$notes_file"' EXIT
          bun scripts/extract-release-notes.ts "$VERSION" frontend/CHANGELOG.md > "$notes_file"

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "$TAG" \
              --notes-file "$notes_file"
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "$TAG" \
              --notes-file "$notes_file"
          fi

  publish-artifacts:
    name: Publish release artifacts
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/_release-artifacts.yml
    with:
      tag: ${{ needs.release.outputs.tag }}

  # Docker image pipeline (see .github/workflows/_docker-build.yml): on a real
  # release, publish `<version>` and keep `latest` on the newest semver tag.
  publish-image:
    name: Publish Docker image
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_docker-build.yml
    with:
      image: ghcr.io/${{ github.repository }}
      publish_latest: ${{ needs.release.outputs.publish_latest == 'true' }}
      version: ${{ needs.release.outputs.version }}
      push: true
