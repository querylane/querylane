name: release-artifacts-ci

env:
  BUN_VERSION: &bun_version 1.3.14
  GORELEASER_VERSION: &goreleaser_version v2.17.1

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .goreleaser.yaml
      - .github/workflows/_release-artifacts.yml
      - .github/workflows/release-artifacts-ci.yml
      - .github/workflows/release.yml
      - .github/workflows/_docker-build.yml
      - Dockerfile
      - backend/main.go
      - backend/service/console/**
      - scripts/build-frontend-for-embed.sh
      - scripts/extract-release-notes.test.ts
      - scripts/extract-release-notes.ts

concurrency:
  group: release-artifacts-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate release artifacts
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: *bun_version

      - name: Test release notes
        run: bun test scripts/extract-release-notes.test.ts

      - name: Build snapshot
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: *goreleaser_version
          args: release --snapshot --clean

      - name: Verify snapshot
        shell: bash
        run: |
          set -euo pipefail

          version="$(jq -r .version .build/goreleaser/metadata.json)"
          mapfile -t archives < <(find .build/goreleaser -maxdepth 1 \( -name '*.tar.gz' -o -name '*.zip' \) -print)
          if [ "${#archives[@]}" -ne 5 ]; then
            echo "::error::Expected 5 release archives, found ${#archives[@]}"
            exit 1
          fi

          (cd .build/goreleaser && sha256sum --check checksums.txt)

          extract_dir="$(mktemp -d)"
          trap 'rm -rf "$extract_dir"' EXIT
          tar -xzf ".build/goreleaser/querylane_${version}_linux_amd64.tar.gz" -C "$extract_dir"

          actual_version="$("$extract_dir/querylane" --version)"
          if [ "$actual_version" != "$version" ]; then
            echo "::error::Expected querylane --version to print $version, got $actual_version"
            exit 1
          fi
