name: Build CLI

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: ""
      publish:
        type: boolean
        default: false
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: false

jobs:
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ inputs.version != '' && format('v{0}', inputs.version) || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.0
      - name: Validate release version
        if: inputs.publish
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(jq -r .version frontend/package.json)" = "$RELEASE_VERSION"
          test "$(git describe --tags --exact-match)" = "v$RELEASE_VERSION"
      - name: Test Homebrew formula generation
        run: |
          bun test scripts/homebrew-*.test.ts
          python3 scripts/smoke-cli.test.py
      - name: Build release artifacts
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          version: v2.18.2
          args: ${{ inputs.publish && 'release --clean --skip=publish' || 'release --snapshot --clean --skip=publish' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Generate Homebrew formula
        if: inputs.publish
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          bun scripts/homebrew-formula.mjs "$RELEASE_VERSION" dist/checksums.txt dist/Formula/querylane.rb
          ruby -c dist/Formula/querylane.rb
      - name: Read packaged version
        id: package
        run: echo "version=$(jq -r .version dist/metadata.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: querylane-cli
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
            dist/Formula/querylane.rb
          if-no-files-found: error

  native-smoke:
    name: Native smoke (${{ matrix.target }})
    needs: cli
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, target: linux_amd64 }
          - { runner: ubuntu-24.04-arm, target: linux_arm64 }
          - { runner: macos-15-intel, target: darwin_amd64 }
          - { runner: macos-15, target: darwin_arm64 }
          - { runner: windows-latest, target: windows_amd64 }
          - { runner: windows-11-arm, target: windows_arm64 }
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ inputs.version != '' && format('v{0}', inputs.version) || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8.0.1
        with:
          name: querylane-cli
          path: dist
      - name: Verify checksum and execute the packaged binary
        env:
          PACKAGED_VERSION: ${{ needs.cli.outputs.version }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: python scripts/smoke-cli.py dist "$PACKAGED_VERSION" --archive-target "$TARGET"

  publish:
    # Never expose artifacts (or update the tap) before the exact archive bytes
    # have passed native checks. No rebuild between verification and upload.
    needs: [cli, native-smoke]
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ format('v{0}', inputs.version) }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.0
      - uses: actions/download-artifact@v8.0.1
        with:
          name: querylane-cli
          path: dist
      - name: Publish verified release assets
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Preserve existing release notes when retrying; create only if absent.
          if ! gh release view "v$RELEASE_VERSION"; then
            gh release create "v$RELEASE_VERSION" --verify-tag --generate-notes
          fi
          gh release upload "v$RELEASE_VERSION" dist/*.tar.gz dist/*.zip dist/*.deb dist/*.rpm dist/checksums.txt dist/Formula/querylane.rb --clobber
      - name: Publish Homebrew formula
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          REPOSITORY_TOKEN: ${{ github.token }}
        run: bun scripts/homebrew-publish.mjs "$RELEASE_VERSION" dist/Formula/querylane.rb
