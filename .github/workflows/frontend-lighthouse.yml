name: frontend-lighthouse

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions: {}

concurrency:
  group: frontend-lighthouse-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evidence:
    name: Advisory Lighthouse evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Install the pinned Playwright Chromium
        run: bun run test:browser:setup
      - name: Build verified production assets and collect fixture-backed evidence
        id: lighthouse
        run: bun run lighthouse:evidence
      - name: Summarize collection and thresholds separately
        if: always()
        env:
          LIGHTHOUSE_OUTCOME: ${{ steps.lighthouse.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '## Advisory Lighthouse run\n\nBuild-and-evidence command: %s.\n\n' "$LIGHTHOUSE_OUTCOME"
            if [[ -f dist/lighthouse/summary.md ]]; then
              cat dist/lighthouse/summary.md
            else
              printf 'No Lighthouse evidence produced. Installation/build/collection did not complete; no score claim.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain reports with repository access only
        if: always() && github.event.repository.private
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            frontend/dist/lighthouse
            frontend/.lighthouseci
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
