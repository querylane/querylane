<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="light dark" name="color-scheme">
    <meta
      content="Querylane is a client-side PostgreSQL admin UI for browsing instances, databases, schemas, tables, roles, and query results."
      name="description"
    >
    <meta
      content="hsl(0 0% 100%)"
      media="(prefers-color-scheme: light)"
      name="theme-color"
    >
    <meta
      content="hsl(0 0% 3.9%)"
      media="(prefers-color-scheme: dark)"
      name="theme-color"
    >
    <link href="/icon.svg" rel="icon" type="image/svg+xml">
    <link href="/manifest.json" rel="manifest">
    <title>QueryLane</title>
  </head>
  <body>
    <div id="root">
      <main
        aria-label="Starting Querylane"
        class="bg-background text-foreground flex min-h-dvh flex-col items-center justify-center gap-4 p-6 text-center font-sans text-sm"
      >
        <div class="noscript:hidden" role="status">
          <img
            alt=""
            class="size-10 dark:hidden"
            height="40"
            src="/icon-light.svg"
            width="40"
          >
          <img
            alt=""
            class="hidden size-10 dark:block"
            height="40"
            src="/icon-dark.svg"
            width="40"
          >
          <h1 class="sr-only">Loading Querylane…</h1>
        </div>
        <noscript>
          <p>Enable JavaScript and reload to use Querylane.</p>
        </noscript>
      </main>
    </div>
  </body>
</html>
