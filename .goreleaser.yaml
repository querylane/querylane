version: 2

project_name: querylane
dist: .build/goreleaser

before:
  hooks:
    - ./scripts/build-frontend-for-embed.sh

builds:
  - id: querylane
    dir: backend
    main: .
    binary: querylane
    flags:
      - -trimpath
    tags:
      - embed_frontend
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - >-
        -s -w
        -X github.com/querylane/querylane/backend/buildstamp.Version={{ .Version }}
        -X github.com/querylane/querylane/backend/buildstamp.GitCommit={{ .ShortCommit }}
        -X github.com/querylane/querylane/backend/buildstamp.BuiltAt={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - ids:
      - querylane
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

release:
  mode: keep-existing
  replace_existing_artifacts: true

changelog:
  disable: true
