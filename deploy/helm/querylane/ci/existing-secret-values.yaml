# CI: production-shaped values using pre-existing Secrets (template/lint only).
replicaCount: 2
metadataDatabase:
  existingSecret:
    name: querylane
    key: dsn
instanceSecretKey:
  existingSecret:
    name: querylane
    key: instance-secret-key
config:
  http:
    host: "0.0.0.0"
    port: 8080
    cors:
      allowed_origins:
        - "https://querylane.example.com"
  instances:
    - id: production
      display_name: "Production"
      host: "db.example.com"
      port: 5432
      database: "app"
      username: "querylane_reader"
      password_env: "PROD_DB_PASSWORD"
      ssl_mode: "require"
extraEnv:
  - name: PROD_DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: prod-db
        key: password
podDisruptionBudget:
  enabled: true
autoscaling:
  enabled: true
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: querylane
