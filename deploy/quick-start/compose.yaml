# Querylane quick start — a complete, disposable evaluation stack.
#
#   curl -fsSL https://raw.githubusercontent.com/querylane/querylane/main/deploy/quick-start/compose.yaml | docker compose -f - up
#
# Then open http://localhost:8080.
#
# What you get:
#   querylane      the Querylane UI on port 8080 (ghcr.io/querylane/querylane)
#   postgres-meta  Querylane's own metadata database (not shown in the UI)
#   postgres-demo  a demo PostgreSQL instance that Querylane inspects
#   seeder         seeder-buddy generating a continuous e-commerce workload
#                  against postgres-demo so Activity and statistics are alive
#
# Requirements: Docker Compose v2.23.1+ (inline `configs.content` below).
# Everything is self-contained; no files are written next to this YAML.
#
# This stack is for evaluation only: credentials are hard-coded, Querylane
# has no built-in authentication, and ports bind to localhost. For a durable
# deployment follow https://docs.querylane.net/get-started/deploy-querylane.
#
# Stop and wipe everything:   docker compose down --volumes
# (or Ctrl+C, then `docker compose -p querylane-quick-start down --volumes`).

name: querylane-quick-start

services:
  querylane:
    image: ghcr.io/querylane/querylane:latest
    command: ["server", "start", "--config", "/etc/querylane/querylane.yaml"]
    environment:
      QUERYLANE_DATABASE_DSN: "postgres://querylane:querylane@postgres-meta:5432/querylane?sslmode=disable"
      # Demo-only key. Generate your own with `openssl rand -base64 32` and keep it stable.
      QUERYLANE_INSTANCE_SECRET_KEY: "enBVvZANFnerufJCw3zJone9AafeoUnhcsJSAq5yEVE="
    configs:
      - source: querylane-config
        target: /etc/querylane/querylane.yaml
    ports:
      - "127.0.0.1:${QUERYLANE_PORT:-8080}:8080"
    depends_on:
      postgres-meta:
        condition: service_healthy
      postgres-demo:
        condition: service_healthy
    cap_drop:
      - ALL
    restart: unless-stopped

  postgres-meta:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: querylane
      POSTGRES_PASSWORD: querylane
      POSTGRES_DB: querylane
    volumes:
      - meta-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U querylane -d querylane"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  postgres-demo:
    image: postgres:17-alpine
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "track_io_timing=on"]
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: postgres
    configs:
      - source: demo-init-sql
        target: /docker-entrypoint-initdb.d/10-querylane-demo.sql
    volumes:
      - demo-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  seeder:
    image: ghcr.io/querylane/seeder-buddy:edge@sha256:873b61bc539c7438c855e20b12c1d1a441a0b4c498729b894c483ceef7fae186
    command: ["run", "-f", "/config/scenario.yaml"]
    environment:
      DATABASE_URL: "postgres://demo:demo@postgres-demo:5432/ecommerce?sslmode=disable"
    configs:
      - source: seeder-scenario
        target: /config/scenario.yaml
    depends_on:
      postgres-demo:
        condition: service_healthy
    restart: unless-stopped

volumes:
  meta-data:
  demo-data:

configs:
  # Querylane configuration. `instances` registers the demo server. When this
  # section is present, instances are managed here and the UI's instance
  # editor is read-only; add your own servers to this list, or delete the
  # section to register instances through the UI instead.
  # Reference: https://docs.querylane.net/get-started/configure-querylane
  querylane-config:
    content: |
      http:
        host: "0.0.0.0"
        port: 8080

      instances:
        - id: demo-ecommerce
          display_name: "Demo: Ecommerce"
          host: "postgres-demo"
          port: 5432
          database: "ecommerce"
          username: "demo"
          password: "demo"
          ssl_mode: "disable"
          labels:
            env: demo
        # - id: my-database
        #   display_name: "My Database"
        #   host: "host.docker.internal"   # reach a PostgreSQL on your machine
        #   port: 5432
        #   database: "myapp"
        #   username: "readonly"
        #   password: "secret"
        #   ssl_mode: "prefer"

  # Runs once on the first start of postgres-demo.
  demo-init-sql:
    content: |
      CREATE DATABASE ecommerce;
      CREATE DATABASE analytics;
      \connect ecommerce
      CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
      \connect analytics
      CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
      CREATE SCHEMA reporting;
      CREATE TABLE reporting.daily_revenue (
        day date PRIMARY KEY,
        orders integer NOT NULL,
        revenue_cents bigint NOT NULL
      );
      INSERT INTO reporting.daily_revenue
      SELECT d::date, (random() * 400)::int, (random() * 9000000)::bigint
      FROM generate_series(now() - interval '89 days', now(), interval '1 day') AS d;

  # seeder-buddy scenario: a stateful e-commerce workload with inserts,
  # status transitions, and soft deletes. https://github.com/querylane/seeder-buddy
  seeder-scenario:
    content: |
      version: v1alpha1

      runtime:
        seed: 20260822
        state:
          backend: memory
          retention: 168h

      datasets:
        customers:
          key: customer_id
          table: customers
          fields:
            customer_id:
              generator: uuid
            email:
              generator: template
              template: "customer-{{customer_id}}@example.com"
              postgres:
                unique: true
            segment:
              generator: weighted_choice
              values:
                vip: 10
                repeat: 30
                new: 60
            status:
              generator: choice
              values: [active, active, active, inactive]
            created_at:
              generator: timestamp.now
            updated_at:
              generator: timestamp.now
            deleted_at: {}

        products:
          key: product_id
          table: products
          fields:
            product_id:
              generator: uuid
            sku:
              generator: template
              template: "SKU-{{product_id}}"
              postgres:
                unique: true
            name:
              generator: choice
              values:
                - Everyday Sneakers
                - Cotton Hoodie
                - Ceramic Mug
                - Travel Backpack
                - Wireless Charger
                - Standing Desk
                - Notebook Set
                - Water Bottle
            category:
              generator: choice
              values: [footwear, apparel, home, travel, electronics, furniture, stationery, kitchen]
            price:
              generator: number.normal
              mean: 72
              stddev: 18
              postgres:
                type: numeric(12, 2)
            status:
              generator: choice
              values: [active, active, active, inactive]
            created_at:
              generator: timestamp.now
            updated_at:
              generator: timestamp.now
            deleted_at: {}

        orders:
          key: order_id
          table: orders
          references:
            customer_id:
              dataset: customers
              strategy: weighted_recent
              where: "status == 'active' and deleted_at == null"
          fields:
            order_id:
              generator: uuid
            customer_id:
              ref: customers.customer_id
            status:
              generator: choice
              values: [pending, paid, fulfilled, cancelled]
            total_amount:
              generator: number.normal
              mean: 108
              stddev: 26
              postgres:
                type: numeric(12, 2)
            created_at:
              generator: timestamp.now
            updated_at:
              generator: timestamp.now
            deleted_at: {}

        order_items:
          key: order_item_id
          table: order_items
          references:
            order_id:
              dataset: orders
              strategy: weighted_recent
              where: "deleted_at == null"
            product_id:
              dataset: products
              strategy: random
              where: "status == 'active' and deleted_at == null"
          fields:
            order_item_id:
              generator: uuid
            order_id:
              ref: orders.order_id
            product_id:
              ref: products.product_id
            quantity:
              generator: choice
              values: [1, 1, 1, 2, 2, 3]
              postgres:
                type: integer
            line_status:
              generator: choice
              values: [reserved, picked, packed]
            created_at:
              generator: timestamp.now
            updated_at:
              generator: timestamp.now

      workloads:
        customer_signup:
          dataset: customers
          operation: insert
          rate:
            per_minute: 30

        product_catalog:
          dataset: products
          operation: insert
          rate:
            per_minute: 10

        order_create:
          dataset: orders
          operation: insert
          rate:
            per_minute: 60
          depends_on:
            min_available:
              customers: 5

        order_item_create:
          dataset: order_items
          operation: insert
          rate:
            per_minute: 90
          depends_on:
            min_available:
              orders: 2
              products: 5

        order_progression:
          dataset: orders
          operation: update
          rate:
            per_minute: 30
          select:
            dataset: orders
            where: "status in ['pending', 'paid'] and deleted_at == null"
            strategy: weighted_recent
          mutate:
            status:
              transition:
                pending: [paid, cancelled]
                paid: [fulfilled]

        product_retire:
          dataset: products
          operation: soft_delete
          rate:
            per_minute: 2
          select:
            dataset: products
            where: "status == 'inactive' and deleted_at == null"
            strategy: oldest

        customer_churn:
          dataset: customers
          operation: soft_delete
          rate:
            per_minute: 1
          select:
            dataset: customers
            where: "status == 'inactive' and deleted_at == null"
            strategy: oldest

      outputs:
        ecommerce:
          kind: postgres
          dsnEnv: DATABASE_URL
          schema: public
          table_policy: drop_and_create
          postgres:
            database_policy: auto_create
          bindings:
            customers:
              dataset: customers
            products:
              dataset: products
            orders:
              dataset: orders
            order_items:
              dataset: order_items

      schedules:
        default:
          workloads:
            - customer_signup
            - product_catalog
            - order_create
            - order_item_create
            - order_progression
            - product_retire
            - customer_churn
