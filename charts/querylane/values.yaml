replicaCount: 1

image:
  repository: ghcr.io/querylane/querylane-dev
  pullPolicy: IfNotPresent
  # Defaults to Chart.appVersion. Set this or digest when changing repository.
  tag: ""
  digest: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

externalDatabase:
  existingSecret: querylane
  dsnKey: database-dsn

instanceSecret:
  existingSecret: querylane
  key: instance-secret-key

service:
  port: 80

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

resources: {}
