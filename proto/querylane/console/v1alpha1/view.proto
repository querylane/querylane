syntax = "proto3";

package querylane.console.v1alpha1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// --------------------------------------------------------------------------
// Service
// --------------------------------------------------------------------------

// ViewService exposes views as a separate resource hierarchy.
service ViewService {
  // Lists views and materialized views in a schema.
  rpc ListViews(ListViewsRequest) returns (ListViewsResponse) {}

  // Gets a single view.
  rpc GetView(GetViewRequest) returns (GetViewResponse) {}

  // Gets one direct relation dependency edge for a view.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME: AIP-131 requires returning the resource directly.
  rpc GetViewDependency(GetViewDependencyRequest) returns (ViewDependency) {
    option (google.api.http) = {get: "/v1alpha1/{name=instances/*/databases/*/schemas/*/views/*/viewDependencies/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists direct relation dependencies for a view.
  rpc ListViewDependencies(ListViewDependenciesRequest) returns (ListViewDependenciesResponse) {
    option (google.api.http) = {get: "/v1alpha1/{parent=instances/*/databases/*/schemas/*/views/*}/viewDependencies"};
    option (google.api.method_signature) = "parent";
  }

  // Refreshes a materialized view within the configured synchronous timeout,
  // which is capped at 30 seconds.
  // aip.dev/not-precedent: This alpha, interactive operation remains
  // synchronous so the UI can report PostgreSQL's immediate result. It fails
  // at the hard deadline; support for longer refreshes must use a long-running
  // operation before that deadline is widened.
  // Returns INVALID_ARGUMENT for a standard view or unsupported mode,
  // FAILED_PRECONDITION when concurrent refresh requirements are unmet, and
  // DEADLINE_EXCEEDED when PostgreSQL cannot finish within the timeout.
  rpc RefreshMaterializedView(RefreshMaterializedViewRequest) returns (RefreshMaterializedViewResponse) {
    option (google.api.http) = {
      post: "/v1alpha1/{name=instances/*/databases/*/schemas/*/views/*}:refresh"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }
}

// --------------------------------------------------------------------------
// Enums
// --------------------------------------------------------------------------

// ViewView controls how much detail the server should populate for View resources.
enum ViewView {
  VIEW_VIEW_UNSPECIFIED = 0;

  // Lightweight projection for list views.
  VIEW_VIEW_BASIC = 1;

  // Full projection including view definition.
  VIEW_VIEW_FULL = 2;
}

// RefreshMaterializedViewMode selects the PostgreSQL refresh strategy.
enum RefreshMaterializedViewMode {
  // Uses a standard, blocking refresh.
  REFRESH_MATERIALIZED_VIEW_MODE_UNSPECIFIED = 0;

  // Replaces the stored rows while preventing concurrent reads.
  REFRESH_MATERIALIZED_VIEW_MODE_STANDARD = 1;

  // Replaces the stored rows without preventing concurrent reads.
  // PostgreSQL requires a qualifying unique index.
  REFRESH_MATERIALIZED_VIEW_MODE_CONCURRENT = 2;
}

// --------------------------------------------------------------------------
// Resource Messages
// --------------------------------------------------------------------------

// A View represents a standard or materialized view within a Schema.
message View {
  option (google.api.resource) = {
    type: "console.querylane.dev/View"
    pattern: "instances/{instance}/databases/{database}/schemas/{schema}/views/{view}"
    plural: "views"
    singular: "view"
  };

  // The type of view object.
  enum ViewType {
    VIEW_TYPE_UNSPECIFIED = 0;
    VIEW_TYPE_STANDARD = 1;
    VIEW_TYPE_MATERIALIZED = 2;
  }

  // Output-only identifier. The unique resource name of the view.
  string name = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_behavior) = IDENTIFIER
  ];

  // Output-only. UI-friendly display name.
  string display_name = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output-only. Whether this is a standard or materialized view.
  ViewType view_type = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output-only. View owner role.
  string owner = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output-only. Comment for the view, if any.
  string comment = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output-only. Whether this is a system view.
  bool is_system_view = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output-only. Definition of the view. Populated for VIEW_VIEW_FULL.
  string definition = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output-only. Estimated size in bytes for materialized views, when known.
  int64 size_bytes = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output-only. Estimated row count for materialized views, when known.
  int64 row_count = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output-only. Whether a materialized view is populated.
  bool is_populated = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output-only. View creation time when available.
  google.protobuf.Timestamp create_time = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output-only. Time of the last DDL change when available.
  google.protobuf.Timestamp last_ddl_time = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A relation connected to a view through PostgreSQL catalog dependencies.
message ViewDependency {
  option (google.api.resource) = {
    type: "console.querylane.dev/ViewDependency"
    pattern: "instances/{instance}/databases/{database}/schemas/{schema}/views/{view}/viewDependencies/{view_dependency}"
    plural: "viewDependencies"
    singular: "viewDependency"
  };

  // Direction identifies which side of the selected view contains the relation.
  enum Direction {
    // The direction is not specified.
    DIRECTION_UNSPECIFIED = 0;

    // The selected view reads from the relation.
    DIRECTION_UPSTREAM = 1;

    // The relation reads from the selected view.
    DIRECTION_DOWNSTREAM = 2;
  }

  // RelationType identifies the PostgreSQL catalog kind of the relation.
  enum RelationType {
    // The relation type is not specified.
    RELATION_TYPE_UNSPECIFIED = 0;

    // A base table.
    RELATION_TYPE_TABLE = 1;

    // A standard view.
    RELATION_TYPE_VIEW = 2;

    // A materialized view.
    RELATION_TYPE_MATERIALIZED_VIEW = 3;

    // A foreign table.
    RELATION_TYPE_FOREIGN_TABLE = 4;

    // A partitioned table.
    RELATION_TYPE_PARTITIONED_TABLE = 5;
  }

  // The dependency edge resource name.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Output-only. Canonical Table or View resource attached to this edge.
  // aip.dev/not-precedent: PostgreSQL dependencies can target either resource
  // type. Runtime construction narrows this wildcard to Table or View.
  string relation = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = {type: "*"}
  ];

  // Output-only. Schema containing the relation.
  string schema_name = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output-only. Relation display name.
  // aip.dev/not-precedent: PostgreSQL owns this identifier and this API only
  // mirrors catalog state, so clients cannot mutate display_name as AIP-148
  // normally recommends.
  string display_name = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output-only. Whether the relation is upstream or downstream of the view.
  Direction direction = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output-only. PostgreSQL relation kind.
  RelationType relation_type = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// --------------------------------------------------------------------------
// RPC Messages
// --------------------------------------------------------------------------

message ListViewsRequest {
  // Required. The parent schema from which to list views.
  // Format: instances/{instance}/databases/{database}/schemas/{schema}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "console.querylane.dev/Schema"},
    (buf.validate.field).string.pattern = "^instances/[a-zA-Z]([a-zA-Z0-9_-]*[a-zA-Z0-9])?/databases/[^/]+/schemas/[^/]+$"
  ];

  int32 page_size = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 1000
    }
  ];

  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Filter expression (an AIP-160 subset: `=`, `!=`, the `:`
  // case-insensitive substring operator, combined with `AND`). Values are
  // quoted strings. Filterable fields:
  //   - name (string; supports the `:` substring operator)
  // Example: name:"daily"
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  string order_by = 5 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Controls whether definitions are populated.
  ViewView view = 6 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).enum.defined_only = true
  ];
}

message ListViewsResponse {
  repeated View views = 1;
  string next_page_token = 2;
}

message GetViewRequest {
  // Required. The name of the view to retrieve.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "console.querylane.dev/View"},
    (buf.validate.field).string.pattern = "^instances/[a-zA-Z]([a-zA-Z0-9_-]*[a-zA-Z0-9])?/databases/[^/]+/schemas/[^/]+/views/[^/]+$"
  ];

  // Optional. Controls whether the definition is populated.
  ViewView view = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).enum.defined_only = true
  ];
}

message GetViewResponse {
  View view = 1;
}

// Request message for GetViewDependency.
message GetViewDependencyRequest {
  // Required. The dependency edge to retrieve.
  // Format: instances/{instance}/databases/{database}/schemas/{schema}/views/{view}/viewDependencies/{view_dependency}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "console.querylane.dev/ViewDependency"},
    (buf.validate.field).string.pattern = "^instances/[a-zA-Z]([a-zA-Z0-9_-]*[a-zA-Z0-9])?/databases/[^/]+/schemas/[^/]+/views/[^/]+/viewDependencies/[a-z][a-z0-9-]{3,62}$"
  ];
}

// Request message for ListViewDependencies.
message ListViewDependenciesRequest {
  // Required. The view whose direct dependencies should be returned.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "console.querylane.dev/View"},
    (buf.validate.field).string.pattern = "^instances/[a-zA-Z]([a-zA-Z0-9_-]*[a-zA-Z0-9])?/databases/[^/]+/schemas/[^/]+/views/[^/]+$"
  ];

  // Optional. Maximum dependencies to return. The server clamps values above
  // 1000 and uses 50 when this is unset.
  int32 page_size = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32.gte = 0
  ];

  // Optional. Opaque continuation token from a previous response.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Filter expression joined by `AND`. name, schema_name, and
  // display_name support `=`, `!=`, and `:`. direction and relation_type
  // support `=` and `!=` with their enum names.
  // aip.dev/not-precedent: For compatibility with Querylane's existing list
  // grammar, `:` is a case-insensitive scalar substring operator rather than
  // AIP-160's collection has operator.
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Comma-separated ordering. Supported fields are name,
  // schema_name, display_name, direction, and relation_type. The default is
  // direction asc, schema_name asc, display_name asc, then name asc.
  string order_by = 5 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for ListViewDependencies.
message ListViewDependenciesResponse {
  // The dependency edges in this page.
  repeated ViewDependency view_dependencies = 1;

  // Opaque token for the next page, or empty when this is the final page.
  string next_page_token = 2;
}

// Request message for RefreshMaterializedView.
message RefreshMaterializedViewRequest {
  // Required. The materialized view to refresh.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "console.querylane.dev/View"},
    (buf.validate.field).string.pattern = "^instances/[a-zA-Z]([a-zA-Z0-9_-]*[a-zA-Z0-9])?/databases/[^/]+/schemas/[^/]+/views/[^/]+$"
  ];

  // Optional. Standard refresh is used when unspecified.
  RefreshMaterializedViewMode mode = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).enum.defined_only = true
  ];

  // Required. Must exactly match the schema-qualified, quoted SQL identifier
  // derived from name, such as `"public"."daily_revenue"`. This prevents
  // stale or accidental UI confirmations from authorizing a different target.
  string confirmation = 3 [(google.api.field_behavior) = REQUIRED];

  // Optional. Per-request timeout override, capped by the server.
  google.protobuf.Duration timeout = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for RefreshMaterializedView.
message RefreshMaterializedViewResponse {
  // The refreshed materialized view.
  View view = 1;
}
